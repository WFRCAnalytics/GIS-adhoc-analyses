project:
  type: website
  output-dir: docs
  brand: _extensions/WFRCAnalytics/wfrc-brand/brand.yml
  render:
    - "**/*.qmd"
    - "!_templates/**"

metadata-files:
  - _extensions/WFRCAnalytics/wfrc-brand/wfrc-shared.yml

website:
  title: "Geospatial Analyses"
  description: >
    Wasatch Front Regional Council -- ad hoc geospatial analyses, tracked
    for code, process, and results.
  site-url: "https://wfrcanalytics.github.io/GIS-adhoc-analyses"
  favicon: "_extensions/WFRCAnalytics/wfrc-brand/assets/logo/abbreviated/WFRC_logo_abbreviated_color_transparent.png"

  page-navigation: false

  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Center Buildout Capacity"
        href: projects/center-buildout-capacity/index.qmd
      - text: "Transportation Choices"
        href: projects/transportation-choices/index.qmd

execute:
  eval: true
  warning: false
  message: false

jupyter: python3

format:
  html:
    code-fold: true
    code-summary: "Show the code"
    lightbox: auto

title-block-banner: true
