[project]
name = "gis-adhoc-analyses"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pukar Bhandari", email = "pukar.bhandari@wfrc.utah.gov" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "fastparquet>=2026.5.0",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.3",
    "pyogrio>=0.13.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
